<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación - Apu Luxury</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/comprador.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .confirmacion-page {
            background-color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        .confirmacion-icono {
            width: 100px;
            height: 100px;
            background-color: rgba(46, 204, 113, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #2ecc71;
            margin-bottom: 30px;
        }
        .confirmacion-titulo {
            font-family: var(--font-serif);
            font-size: 36px;
            color: var(--negro-oscuro);
            margin-bottom: 15px;
        }
        .confirmacion-mensaje {
            font-size: 16px;
            color: #666;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.7;
        }
        .confirmacion-detalles {
            background-color: var(--crema);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            margin-bottom: 40px;
        }
        .detalle-linea {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .detalle-linea:last-child {
            border-bottom: none;
        }
        .detalle-label {
            color: #666;
            font-size: 14px;
        }
        .detalle-valor {
            font-weight: 700;
            color: var(--negro-oscuro);
            font-size: 14px;
        }
        .confirmacion-acciones {
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>
    <nav class="navbar sticky">
        <div class="logo">
            <a href="../index.html">
                <img src="../image/Logo-Apu-Luxury-dorado-negro.png" alt="Apu Luxury" class="logo-img">
            </a>
        </div>
    </nav>

    <div class="confirmacion-page">
        <div class="confirmacion-icono">
            <i class="fas fa-check"></i>
        </div>
        <h1 class="confirmacion-titulo">¡Pedido Confirmado!</h1>
        <p class="confirmacion-mensaje">
            Gracias por tu compra. Tu pedido ha sido confirmado y será procesado por el vendedor. 
            Recibirás un correo con los detalles y el código de seguimiento.
        </p>
        
        <div class="confirmacion-detalles" id="detallesPedido">
        </div>
        
        <div class="confirmacion-acciones">
            <a href="seguimiento-publico.html" class="btn btn-primary">
                SEGUIR PEDIDO
            </a>
            <a href="catalogo.html" class="btn btn-outline-dark">
                SEGUIR COMPRANDO
            </a>
        </div>
    </div>

    <script src="../assets/js/storage.js"></script>
    <script>
        function mostrarConfirmacion() {
            const params = new URLSearchParams(window.location.search);
            const pedidoId = params.get('pedido');
            
            if (!pedidoId) {
                window.location.href = 'catalogo.html';
                return;
            }
            
            const pedido = obtenerPedidoPorId(pedidoId);
            
            if (!pedido) {
                window.location.href = 'catalogo.html';
                return;
            }
            
            const container = document.getElementById('detallesPedido');
            container.innerHTML = `
                <div class="detalle-linea">
                    <span class="detalle-label">Número de Orden</span>
                    <span class="detalle-valor">${pedido.numeroOrden}</span>
                </div>
                <div class="detalle-linea">
                    <span class="detalle-label">Código de Seguimiento</span>
                    <span class="detalle-valor">${pedido.codigoSeguimiento}</span>
                </div>
                <div class="detalle-linea">
                    <span class="detalle-label">Fecha del Pedido</span>
                    <span class="detalle-valor">${pedido.fechaPedido}</span>
                </div>
                <div class="detalle-linea">
                    <span class="detalle-label">Estado</span>
                    <span class="detalle-valor">${pedido.estado.toUpperCase()}</span>
                </div>
                <div class="detalle-linea">
                    <span class="detalle-label">Total</span>
                    <span class="detalle-valor">S/ ${pedido.total}</span>
                </div>
            `;
        }
        
        document.addEventListener('DOMContentLoaded', mostrarConfirmacion);
    </script>
<script>document.querySelectorAll(".navbar").forEach(function(nav){window.addEventListener("scroll",function(){if(window.scrollY>50){nav.style.backgroundColor="rgba(26,26,26,0.95)";nav.style.padding="20px 50px"}else{nav.style.backgroundColor="rgba(0,0,0,0.85)";nav.style.padding="25px 50px"}})})</script></body>
</html>
