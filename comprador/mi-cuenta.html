<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Apu Luxury</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/comprador.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .cuenta-page { background-color: var(--white); min-height: 100vh; padding-top: 80px; }
        .cuenta-header { background-color: var(--negro-oscuro); padding: 40px 50px; color: var(--white); }
        .cuenta-header h1 { font-family: var(--font-serif); font-size: 28px; margin-bottom: 5px; }
        .cuenta-header p { color: #aaa; }
        .cuenta-container { display: grid; grid-template-columns: 250px 1fr; gap: 30px; max-width: 1200px; margin: 0 auto; padding: 40px 50px; }
        .cuenta-menu { background-color: var(--crema); border-radius: 12px; padding: 20px; height: fit-content; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 8px; color: var(--negro-oscuro); font-size: 14px; cursor: pointer; transition: all 0.3s ease; text-decoration: none; }
        .menu-item:hover, .menu-item.active { background-color: var(--white); color: var(--orange); }
        .menu-item i { width: 20px; }
        .cuenta-contenido { background-color: var(--crema); border-radius: 12px; padding: 30px; }
        .info-seccion { margin-bottom: 30px; }
        .info-titulo { font-size: 14px; font-weight: 700; color: var(--negro-oscuro); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .info-item { margin-bottom: 15px; }
        .info-label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .info-valor { font-size: 14px; color: var(--negro-oscuro); font-weight: 600; }
        .cuenta-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar sticky">
        <div class="logo"><a href="../index.html"><img src="../image/Logo-Apu-Luxury-dorado-negro.png" alt="Apu Luxury" class="logo-img"></a></div>
        <div class="nav-menu"><ul><li><a href="catalogo.html">CATÁLOGO</a></li></ul></div>
        <div class="nav-icons"><a href="carrito.html" class="cart-icon"><i class="fas fa-shopping-bag"></i><span class="cart-badge" id="cartCount">0</span></a></div>
    </nav>

    <div class="cuenta-page">
        <div class="cuenta-header"><h1>Mi Cuenta</h1><p>Gestiona tu información personal</p></div>
        <div class="cuenta-container">
            <div class="cuenta-menu">
                <a href="mi-cuenta.html" class="menu-item active"><i class="fas fa-user"></i> Mi Cuenta</a>
                <a href="seguimiento-privado.html" class="menu-item"><i class="fas fa-box"></i> Mis Pedidos</a>
                <a href="#" class="menu-item"><i class="fas fa-heart"></i> Favoritos</a>
                <a href="../index.html" onclick="cerrarSesion(); window.location.href='../index.html'; return false;" class="menu-item" id="btnLogout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </div>
            <div class="cuenta-contenido" id="infoCuenta"></div>
        </div>
    </div>

    <script src="../assets/js/storage.js"></script>
    <script>
        function cargarInfoCuenta() {
            const sesion = obtenerSesion() || { id: 'usr_001', nombre: 'Usuario Demo', email: 'demo@email.com', telefono: '+51 999 999 999', rol: 'comprador' };
            document.getElementById('infoCuenta').innerHTML = `
                <div class="info-seccion">
                    <img src="${sesion.avatar || 'https://via.placeholder.com/100'}" alt="Avatar" class="cuenta-avatar">
                    <h3 class="info-titulo" style="margin-top: 15px;">Información Personal</h3>
                    <div class="info-grid">
                        <div class="info-item"><p class="info-label">Nombre Completo</p><p class="info-valor">${sesion.nombre}</p></div>
                        <div class="info-item"><p class="info-label">Correo Electrónico</p><p class="info-valor">${sesion.email}</p></div>
                        <div class="info-item"><p class="info-label">Teléfono</p><p class="info-valor">${sesion.telefono}</p></div>
                        <div class="info-item"><p class="info-label">Tipo de Cuenta</p><p class="info-valor">${sesion.rol === 'comprador' ? 'Comprador' : 'Vendedor'}</p></div>
                    </div>
                </div>
            `;
            const items = obtenerCarrito();
            document.getElementById('cartCount').textContent = items.reduce((sum, i) => sum + i.cantidad, 0);
        }
        document.addEventListener('DOMContentLoaded', cargarInfoCuenta);
    </script>
<script>document.querySelectorAll(".navbar").forEach(function(nav){window.addEventListener("scroll",function(){if(window.scrollY>50){nav.style.backgroundColor="rgba(26,26,26,0.95)";nav.style.padding="20px 50px"}else{nav.style.backgroundColor="rgba(0,0,0,0.85)";nav.style.padding="25px 50px"}})})</script></body>
</html>
