<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Apu Luxury</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <img src="image/Logo-Apu-Luxury-dorado-negro.png" alt="Apu Luxury">
            </div>

            <div class="auth-card">
                <h1 class="auth-title">Bienvenido de nuevo</h1>
                <p class="auth-subtitle">Inicia sesión para continuar comprando</p>

                <div id="errorLogin" class="auth-error"></div>

                <form id="formularioLogin" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" id="email" class="form-input" placeholder="tu@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Contraseña</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        INICIAR SESIÓN
                    </button>
                </form>

                <div class="auth-divider">
                    <span>O REGISTRATE CON</span>
                </div>

                <div class="auth-switch">
                    ¿No tienes cuenta?
                    <a href="registro.html">Crear una cuenta</a>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
