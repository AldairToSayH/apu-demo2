<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportación - Apu Luxury Vendedor</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/vendedor.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="vendedor-page">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><img src="../../image/Logo-Apu-Luxury-dorado-negro.png" alt="APU"></div>
            <nav class="sidebar-menu">
                <p class="sidebar-menu-title">Inicio</p>
                <a href="dashboard.html" class="sidebar-menu-item"><i class="fas fa-home"></i><span>Inicio</span></a>
                <p class="sidebar-menu-title">Productos</p>
                <a href="productos.html" class="sidebar-menu-item"><i class="fas fa-plus-circle"></i><span>Agregar</span></a>
                <p class="sidebar-menu-title">Pedidos</p>
                <a href="pedidos.html" class="sidebar-menu-item"><i class="fas fa-shopping-cart"></i><span>Pedidos</span></a>
                <p class="sidebar-menu-title">Exportación</p>
                <a href="exportacion.html" class="sidebar-menu-item active"><i class="fas fa-shipping-fast"></i><span>Métodos de Envío</span></a>
                <a href="documentacion.html" class="sidebar-menu-item"><i class="fas fa-file-alt"></i><span>Documentación</span></a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-header"><div class="header-left"><h1 class="header-title">Métodos de Envío</h1></div></header>
            <section class="content-section">
                <div class="section-header"><h2 class="section-title">Configurar Envíos</h2></div>
                <div class="quick-actions" style="grid-template-columns: repeat(2, 1fr);">
                    <div class="quick-action-card" onclick="abrirEnvioModal()">
                        <div class="quick-action-icon"><i class="fas fa-truck"></i></div>
                        <h3 class="quick-action-title">Envío Nacional</h3>
                        <p class="quick-action-desc">Configurar costos de envío dentro del Perú</p>
                    </div>
                    <div class="quick-action-card" onclick="abrirEnvioModal()">
                        <div class="quick-action-icon"><i class="fas fa-plane"></i></div>
                        <h3 class="quick-action-title">Envío Internacional</h3>
                        <p class="quick-action-desc">Configurar envíos internacionales</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <div class="modal-overlay" id="envioModal">
        <div class="modal">
            <div class="modal-header"><h3 class="modal-title">Métodos de Envío</h3><button class="modal-close" onclick="cerrarModal()">&times;</button></div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label"><input type="checkbox" id="envioNacional"> Habilitar envío nacional</label><input type="number" id="costoNacional" class="form-input" placeholder="15" style="margin-top:10px;"></div>
                <div class="form-group"><label class="form-label"><input type="checkbox" id="envioInternacional"> Habilitar envío internacional</label><input type="number" id="costoInternacional" class="form-input" placeholder="45" style="margin-top:10px;"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary" onclick="guardarEnvio()">GUARDAR</button></div>
        </div>
    </div>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/vendedor.js"></script>
    <script>document.addEventListener('DOMContentLoaded',cargarVendedor);</script>
</body>
</html>
