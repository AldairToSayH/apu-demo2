<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Apu Luxury Vendedor</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/vendedor.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="vendedor-page">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><img src="../../image/Logo-Apu-Luxury-dorado-negro.png" alt="APU"></div>
            <nav class="sidebar-menu">
                <p class="sidebar-menu-title">Inicio</p>
                <a href="dashboard.html" class="sidebar-menu-item"><i class="fas fa-home"></i><span>Inicio</span></a>
                <a href="estadisticas.html" class="sidebar-menu-item"><i class="fas fa-chart-line"></i><span>Estadísticas</span></a>
                <p class="sidebar-menu-title">Productos</p>
                <a href="productos.html" class="sidebar-menu-item"><i class="fas fa-plus-circle"></i><span>Agregar Producto</span></a>
                <a href="inventario.html" class="sidebar-menu-item"><i class="fas fa-boxes"></i><span>Inventario</span></a>
                <p class="sidebar-menu-title">Pedidos</p>
                <a href="pedidos.html" class="sidebar-menu-item active"><i class="fas fa-shopping-cart"></i><span>Todos los Pedidos</span></a>
                <p class="sidebar-menu-title">Exportación</p>
                <a href="exportacion.html" class="sidebar-menu-item"><i class="fas fa-shipping-fast"></i><span>Métodos de Envío</span></a>
                <a href="documentacion.html" class="sidebar-menu-item"><i class="fas fa-file-alt"></i><span>Documentación</span></a>
                <p class="sidebar-menu-title">Configuración</p>
                <a href="perfil.html" class="sidebar-menu-item"><i class="fas fa-store"></i><span>Perfil</span></a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-header">
                <div class="header-left"><h1 class="header-title">Pedidos</h1></div>
                <div class="header-right">
                    <button class="notification-btn"><i class="fas fa-bell"></i><span class="badge">3</span></button>
                    <div class="user-profile"><img src="https://via.placeholder.com/40" alt="Usuario" class="user-avatar"></div>
                </div>
            </header>
            <section class="content-section">
                <div class="section-header">
                    <h2 class="section-title">Todos los Pedidos</h2>
                    <div style="display: flex; gap: 10px;">
                        <select class="form-select" style="width: 150px;" id="filtroEstado">
                            <option value="todos">Todos</option>
                            <option value="origen">Origen</option>
                            <option value="transito">Transito</option>
                            <option value="destino">Destino</option>
                            <option value="entregado">Entregado</option>
                        </select>
                    </div>
                </div>
                <table class="data-table">
                    <thead><tr><th>Pedido</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead>
                    <tbody id="pedidosTable"></tbody>
                </table>
            </section>
        </main>
    </div>
    <div class="modal-overlay" id="pedidoModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Detalles del Pedido</h3>
                <button class="modal-close" onclick="cerrarModal()">&times;</button>
            </div>
            <div class="modal-body" id="pedidoDetalle"></div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="cerrarModal()">CERRAR</button>
            </div>
        </div>
    </div>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/vendedor.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function(){cargarVendedor();cargarTodosPedidos();function cargarTodosPedidos(){const pedidos=obtenerPedidosPorVendedor(vendedorActual?.id)||[];document.getElementById('pedidosTable').innerHTML=pedidos.length?pedidos.map(p=>`<tr><td><strong>${p.numeroOrden}</strong></td><td>${p.cliente?.nombre}</td><td>${p.productos?.length||0}</td><td>S/ ${p.total}</td><td><span class="status-badge status-${p.estado}">${p.estado.toUpperCase()}</span></td><td>${p.fechaPedido}</td><td><button class="action-btn edit" onclick="verDetallePedido('${p.id}')">VER</button></td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;padding:40px;color:#888;">No hay pedidos</td></tr>';}});
    </script>
</body>
</html>
