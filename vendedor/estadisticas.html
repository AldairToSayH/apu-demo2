<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Apu Luxury Vendedor</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/vendedor.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="vendedor-page">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><img src="../image/Logo-Apu-Luxury-dorado-negro.png" alt="APU"></div>
            <nav class="sidebar-menu">
                <p class="sidebar-menu-title">Inicio</p>
                <a href="dashboard.html" class="sidebar-menu-item"><i class="fas fa-home"></i><span>Inicio</span></a>
                <a href="estadisticas.html" class="sidebar-menu-item active"><i class="fas fa-chart-line"></i><span>Estadísticas</span></a>
                <p class="sidebar-menu-title">Productos</p>
                <a href="productos.html" class="sidebar-menu-item"><i class="fas fa-plus-circle"></i><span>Agregar</span></a>
                <a href="inventario.html" class="sidebar-menu-item"><i class="fas fa-boxes"></i><span>Inventario</span></a>
                <p class="sidebar-menu-title">Pedidos</p>
                <a href="pedidos.html" class="sidebar-menu-item"><i class="fas fa-shopping-cart"></i><span>Pedidos</span></a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-header"><div class="header-left"><h1 class="header-title">Estadísticas</h1></div></header>
            <section class="content-section">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-card-icon gold"><i class="fas fa-soles"></i></div><p class="stat-card-value" id="ventasMes">S/ 0</p><p class="stat-card-label">Ventas del Mes</p></div>
                    <div class="stat-card"><div class="stat-card-icon orange"><i class="fas fa-box"></i></div><p class="stat-card-value" id="pedidosMes">0</p><p class="stat-card-label">Pedidos del Mes</p></div>
                    <div class="stat-card"><div class="stat-card-icon green"><i class="fas fa-percentage"></i></div><p class="stat-card-value" id="conversion">0%</p><p class="stat-card-label">Tasa de Conversión</p></div>
                    <div class="stat-card"><div class="stat-card-icon pink"><i class="fas fa-star"></i></div><p class="stat-card-value" id="ratingV">0.0</p><p class="stat-card-label">Calificación</p></div>
                </div>
                <div class="section-header"><h2 class="section-title">Producto Más Vendido</h2></div>
                <div id="topProducto" style="background: var(--crema); padding: 30px; border-radius: 12px; text-align: center;"></div>
            </section>
        </main>
    </div>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/vendedor.js"></script>
    <script>document.addEventListener('DOMContentLoaded',function(){cargarVendedor();if(vendedorActual){document.getElementById('ventasMes').textContent='S/ '+vendedorActual.ventasTotales;document.getElementById('pedidosMes').textContent=vendedorActual.pedidosTotales;document.getElementById('ratingV').textContent=vendedorActual.rating.toFixed(1);document.getElementById('conversion').textContent='3.2%';document.getElementById('topProducto').innerHTML='<p style="font-size:18px;font-weight:700;">'+vendedorActual.nombreTienda+'</p><p style="color:#888;">Aún no hay suficientes datos</p>';}});</script>
</body>
</html>
