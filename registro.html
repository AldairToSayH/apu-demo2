<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Apu Luxury</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <img src="image/Logo-Apu-Luxury-dorado-negro.png" alt="Apu Luxury">
            </div>

            <div class="auth-card">
                <h1 class="auth-title">Crear Cuenta</h1>
                <p class="auth-subtitle">Únete a la comunidad andina</p>

                <div id="errorGeneral" class="auth-error"></div>
                <div id="successMensaje" class="auth-success"></div>

                <form id="formularioRegistro" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">¿Cómo quieres registrarte?</label>
                        <div class="role-selector">
                            <label class="role-btn">
                                <input type="radio" name="rol" value="comprador" checked style="display: none;">
                                <i class="fas fa-shopping-bag"></i>
                                <span>Quiero Comprar</span>
                            </label>
                            <label class="role-btn">
                                <input type="radio" name="rol" value="vendedor" style="display: none;">
                                <i class="fas fa-store"></i>
                                <span>Quiero Vender</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" id="nombre" class="form-input" placeholder="Ana María Quispe" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" id="email" class="form-input" placeholder="ana@email.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Teléfono</label>
                        <input type="tel" id="telefono" class="form-input" placeholder="+51 984 123 456" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Contraseña</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" class="form-input" placeholder="Mínimo 6 caracteres" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirmar Contraseña</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" class="form-input" placeholder="Repite tu contraseña" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        CREAR MI CUENTA
                    </button>
                </form>

                <div class="auth-divider">
                    <span>Ó INICIA SESIÓN</span>
                </div>

                <div class="auth-switch">
                    ¿Ya tienes cuenta?
                    <a href="login.html">Iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
